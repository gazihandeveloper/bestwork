<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BestWork · WhatsApp İş Paneli</title>
<style>
  :root{
    --bg:#202124;--surface:#292a2d;--surface2:#303134;--line:#3c4043;--line2:#5f6368;
    --ink:#e8eaed;--muted:#9aa0a6;
    --blue:#8ab4f8;--blue-d:#aecbfa;--green:#81c995;--amber:#fdd663;--red:#f28b82;
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:'Roboto','Google Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
    font-size:14px;line-height:1.5;
  }
  header{
    background:var(--surface2);color:var(--ink);padding:14px 24px;
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;
  }
  header h1{margin:0;font-size:16px;font-weight:500;letter-spacing:.1px;display:flex;align-items:center;gap:10px}
  header h1 .logo{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#202124;display:flex;align-items:center;justify-content:center;font-size:14px}
  .conn{display:inline-flex;align-items:center;gap:8px;background:var(--surface);padding:6px 14px;border-radius:999px;font-size:12px;font-weight:500;color:var(--ink);border:1px solid var(--line2)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
  .wrap{max-width:1240px;margin:20px auto 60px;padding:0 18px}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .n{font-size:26px;font-weight:500;line-height:1.1;color:var(--ink)}
  .stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:500;margin-top:4px}
  .stat.p .n{color:var(--blue)}
  .stat.w .n{color:var(--amber)}
  .stat.d .n{color:var(--green)}
  .stat.e .n{color:var(--red)}

  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));grid-auto-rows:1fr;gap:12px}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:16px;display:flex;flex-direction:column;height:236px;
    transition:background .15s ease,border-color .15s ease;
  }
  .card:hover{background:var(--surface2);border-color:var(--line2)}
  .card.processing{border-color:var(--amber)}
  .card.done{border-color:var(--line2)}
  .card.error{border-color:var(--red)}
  .card.ignored{opacity:.5}

  .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
  .who{display:flex;align-items:center;gap:8px;min-width:0;color:var(--ink);font-weight:500}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--line2);color:var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .badge{font-size:10.5px;font-weight:500;letter-spacing:.3px;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .b-pending{background:rgba(138,180,248,.16);color:var(--blue)}
  .b-processing{background:rgba(253,214,99,.16);color:var(--amber)}
  .b-done{background:rgba(129,201,149,.16);color:var(--green)}
  .b-error{background:rgba(242,139,130,.16);color:var(--red)}
  .b-ignored{background:rgba(154,160,166,.16);color:var(--muted)}
  .req{font-size:14px;font-weight:400;line-height:1.5;margin:2px 0 14px;white-space:pre-wrap;word-break:break-word;color:var(--ink);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

  .steps{display:flex;align-items:center;margin-top:auto}
  .step{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap}
  .step .ic{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1}
  .step.done{color:var(--blue)} .step.done .ic{background:var(--blue);border-color:var(--blue);color:#202124}
  .step.active{color:var(--amber)} .step.active .ic{border-color:var(--amber)}
  .step.bad{color:var(--red)} .step.bad .ic{background:var(--red);border-color:var(--red);color:#202124}
  .bar{flex:1;height:2px;background:var(--line);margin:0 8px;min-width:14px;border-radius:2px}
  .res{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:10px;white-space:pre-wrap;color:var(--muted);max-height:64px;overflow:auto}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:56px;background:var(--surface);border:1px dashed var(--line2);border-radius:12px}
  .spinner{width:11px;height:11px;border:2px solid rgba(253,214,99,.3);border-top-color:var(--amber);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .pager{display:flex;justify-content:center;align-items:center;gap:6px;margin:20px 0 0;flex-wrap:wrap}
  .pg{min-width:36px;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;font-size:13px;cursor:pointer;font-family:inherit;transition:background .15s}
  .pg:hover:not(:disabled){background:var(--surface2)}
  .pg.on{background:var(--blue);border-color:var(--blue);color:#202124}
  .pg:disabled{opacity:.4;cursor:not-allowed}
  .pg.info{border:none;background:transparent;color:var(--muted);font-weight:400;cursor:default}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}#list{grid-template-columns:1fr}.step{font-size:10.5px;gap:5px}.card{height:auto;min-height:200px}}
</style>
</head>
<body>
<header>
  <h1><span class="logo">🐼</span> BestWork · WhatsApp İş Paneli</h1>
  <span class="conn"><span class="dot"></span><span id="conn">…</span></span>
</header>
<div class="wrap">
  <div class="stats">
    <div class="stat p"><div class="n" id="s-pending">0</div><div class="l">İş emri bekliyor</div></div>
    <div class="stat w"><div class="n" id="s-processing">0</div><div class="l">İşleniyor</div></div>
    <div class="stat d"><div class="n" id="s-done">0</div><div class="l">Sonuçlandı</div></div>
    <div class="stat e"><div class="n" id="s-error">0</div><div class="l">Hata</div></div>
  </div>
  <div id="list"></div>
  <div class="pager" id="pager"></div>
</div>
<script>
  const esc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const step = (cls, label, ic) => '<div class="step ' + cls + '"><span class="ic">' + (ic || '') + '</span>' + label + '</div>';
  const bars = '<div class="bar"></div>';
  const spin = '<span class="spinner"></span>';
  const initials = (m) => {
    const n = (m.name || m.from || '?').trim();
    return n.slice(0, 1).toUpperCase();
  };

  function stepsFor(st) {
    if (st === 'processing')
      return step('done', 'Geldi', '✓') + bars + step('active', 'İşleniyor', spin) + bars + step('', 'Bitti');
    if (st === 'done')
      return step('done', 'Geldi', '✓') + bars + step('done', 'İşlendi', '✓') + bars + step('done', 'Bitti', '✓');
    if (st === 'error')
      return step('done', 'Geldi', '✓') + bars + step('done', 'İşlendi', '✓') + bars + step('bad', 'Başarısız', '✕');
    if (st === 'ignored')
      return step('', 'Geldi') + bars + step('', '—') + bars + step('', 'Yok sayıldı');
    return step('active', 'Geldi') + bars + step('', 'İşleniyor') + bars + step('', 'Bitti');
  }

  const LABEL = { pending: 'İş emri bekliyor', processing: 'İşleniyor', done: 'Sonuçlandı', error: 'Hata', ignored: 'Yok sayıldı' };

  async function tick() {
    try {
      const q = await (await fetch('/qr')).json();
      document.getElementById('conn').textContent = q.status || '-';
    } catch (e) {}
    try {
      const d = await (await fetch('/messages')).json();
      const ms = (d.messages || []).filter((m) => m.status !== 'ignored').slice().reverse();
      const c = { pending: 0, processing: 0, done: 0, error: 0 };
      ms.forEach((m) => { if (c[m.status] !== undefined) c[m.status]++; });
      document.getElementById('s-pending').textContent = c.pending;
      document.getElementById('s-processing').textContent = c.processing;
      document.getElementById('s-done').textContent = c.done;
      document.getElementById('s-error').textContent = c.error;

      allMs = ms;
      render();
    } catch (e) {}
  }

  let allMs = [];
  let page = 1;
  const PER = 9;

  function cardHtml(m) {
    const st = m.status || 'pending';
    const t = new Date(m.ts).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    return '<div class="card ' + st + '">' +
      '<div class="meta">' +
        '<span class="who"><span class="avatar">' + esc(initials(m)) + '</span>' + esc(m.name || m.from) + '</span>' +
        '<span class="badge b-' + st + '">' + (LABEL[st] || st) + '</span>' +
      '</div>' +
      '<div class="req">' + esc(m.text) + (m.image ? ' <span class="badge b-pending">📷 resim</span>' : '') + '</div>' +
      '<div class="steps">' + stepsFor(st) + '</div>' +
      (m.result ? '<div class="res">' + esc(m.result) + '</div>' : '') +
      '<div style="font-size:11px;color:#9aa0a6;margin-top:8px">' + t + '</div>' +
      '</div>';
  }

  function pageNums(cur, total) {
    const out = [];
    const add = (v) => { if (!out.includes(v)) out.push(v); };
    add(1);
    for (let i = cur - 1; i <= cur + 1; i++) if (i > 1 && i < total) add(i);
    add(total);
    out.sort((a, b) => a - b);
    const res = [];
    let prev = 0;
    for (const n of out) {
      if (n - prev > 1) res.push('…');
      res.push(n);
      prev = n;
    }
    return res;
  }

  function render() {
    const pages = Math.max(1, Math.ceil(allMs.length / PER));
    if (page > pages) page = pages;
    if (page < 1) page = 1;
    const slice = allMs.slice((page - 1) * PER, page * PER);
    document.getElementById('list').innerHTML =
      slice.map(cardHtml).join('') ||
      '<div class="empty">Henüz iş emri yok.<br/>Ender “panda ... ” yazınca burada kutu olarak görünür.</div>';

    const p = document.getElementById('pager');
    if (allMs.length <= PER) {
      p.innerHTML = allMs.length ? '<span class="pg info">' + allMs.length + ' iş emri</span>' : '';
      return;
    }
    let h = '<button class="pg" ' + (page === 1 ? 'disabled' : '') + ' onclick="go(' + (page - 1) + ')">‹</button>';
    for (const n of pageNums(page, pages)) {
      h += n === '…'
        ? '<span class="pg info">…</span>'
        : '<button class="pg ' + (n === page ? 'on' : '') + '" onclick="go(' + n + ')">' + n + '</button>';
    }
    h += '<button class="pg" ' + (page === pages ? 'disabled' : '') + ' onclick="go(' + (page + 1) + ')">›</button>';
    h += '<span class="pg info">' + page + ' / ' + pages + ' · ' + allMs.length + ' iş</span>';
    p.innerHTML = h;
  }

  window.go = (n) => {
    page = n;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  tick();
  setInterval(tick, 2000);
</script>
</body>
</html>
