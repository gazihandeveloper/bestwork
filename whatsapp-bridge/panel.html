<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BestWork · WhatsApp İş Paneli</title>
<style>
  :root{
    --ink:#ece9fb;--muted:#8f8bb0;
    --neon:#a855f7;--neon2:#22d3ee;--pink:#e879f9;
    --green:#22c55e;--amber:#f59e0b;--red:#ef4444;--blue:#38bdf8;
    --card:rgba(22,17,40,.82);--card2:rgba(30,23,55,.9);--line:rgba(168,85,247,.28);
  }
  *{box-sizing:border-box}
  body{
    margin:0;color:var(--ink);min-height:100vh;
    font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(139,92,246,.13), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(34,211,238,.07), transparent 55%),
      radial-gradient(1000px 700px at 50% 120%, rgba(109,40,217,.11), transparent 60%),
      linear-gradient(160deg,#050409 0%,#080611 45%,#060409 100%);
    background-attachment:fixed;
  }
  header{
    background:linear-gradient(120deg,#5b21b6,#7c3aed 48%,#0e7490);
    color:#fff;padding:18px 26px;display:flex;justify-content:space-between;align-items:center;
    box-shadow:0 10px 26px -18px rgba(0,0,0,.9),inset 0 -1px 0 rgba(255,255,255,.08);
    position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)
  }
  header h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.4px;display:flex;align-items:center;gap:10px}
  header h1 .logo{width:28px;height:28px;border-radius:9px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:14px}
  .conn{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.28);padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;border:1px solid rgba(255,255,255,.16)}
  .dot{width:8px;height:8px;border-radius:50%;background:#a5b4fc;box-shadow:0 0 0 3px rgba(165,180,252,.15)}
  .wrap{max-width:1240px;margin:22px auto 60px;padding:0 18px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;position:relative;overflow:hidden;box-shadow:0 18px 40px -26px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.04)}
  .stat:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--muted)}
  .stat.p:before{background:var(--blue)}
  .stat.w:before{background:var(--amber)}
  .stat.d:before{background:var(--green)}
  .stat.e:before{background:var(--red)}
  .stat .n{font-size:28px;font-weight:800;line-height:1.1}
  .stat .l{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--muted);font-weight:700;margin-top:3px}
  .stat.p .n{color:var(--blue)}
  .stat.w .n{color:var(--amber)}
  .stat.d .n{color:var(--green)}
  .stat.e .n{color:var(--red)}

  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));grid-auto-rows:1fr;gap:16px}
  .card{
    background:linear-gradient(180deg,var(--card2),var(--card));
    border:1px solid var(--line);border-radius:18px;padding:16px 16px 14px;
    position:relative;overflow:hidden;display:flex;flex-direction:column;height:236px;
    box-shadow:0 18px 36px -32px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.03);
    transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease;
  }
  .card:hover{transform:translateY(-2px);border-color:rgba(168,85,247,.4);box-shadow:0 22px 42px -30px rgba(0,0,0,.95)}
  .card:before{content:'';position:absolute;left:0;right:0;top:0;height:3px;background:var(--blue);opacity:.85}
  .card.processing:before{background:linear-gradient(90deg,var(--amber),#fbbf24)}
  .card.done:before{background:linear-gradient(90deg,var(--neon),var(--neon2));opacity:.75}
  .card.error:before{background:var(--red)}
  .card.ignored:before{background:#64748b}
  .card.processing{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{box-shadow:0 18px 36px -32px rgba(0,0,0,.95)}50%{box-shadow:0 20px 40px -28px rgba(245,158,11,.35)}}
  .meta{font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
  .who{display:flex;align-items:center;gap:8px;min-width:0;color:#cfc9ee;font-weight:600}
  .avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#0891b2);color:#0b0614;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .badge{font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap;border:1px solid transparent}
  .b-pending{background:rgba(56,189,248,.14);color:#7dd3fc;border-color:rgba(56,189,248,.4)}
  .b-processing{background:rgba(245,158,11,.14);color:#fcd34d;border-color:rgba(245,158,11,.45)}
  .b-done{background:rgba(168,85,247,.16);color:#d8b4fe;border-color:rgba(168,85,247,.5)}
  .b-error{background:rgba(239,68,68,.16);color:#fca5a5;border-color:rgba(239,68,68,.5)}
  .b-ignored{background:rgba(148,163,184,.14);color:#94a3b8;border-color:rgba(148,163,184,.35)}
  .req{font-size:14.5px;font-weight:600;line-height:1.45;margin:2px 0 14px;white-space:pre-wrap;word-break:break-word;color:#efeaff;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
  .steps{display:flex;align-items:center;margin-top:auto}
  .step{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:#6f6a91;white-space:nowrap}
  .step .ic{width:20px;height:20px;border-radius:50%;border:2px solid #3b3557;display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1}
  .step.done{color:#c4b5fd}.step.done .ic{background:linear-gradient(135deg,#7c3aed,#0891b2);border-color:transparent;color:#0b0614}
  .step.active{color:#fcd34d}.step.active .ic{border-color:var(--amber)}
  .step.bad{color:#fca5a5}.step.bad .ic{background:var(--red);border-color:transparent;color:#fff}
  .bar{flex:1;height:2px;background:rgba(148,163,184,.2);margin:0 8px;min-width:14px;border-radius:2px}
  .res{font-size:12px;background:rgba(10,7,20,.7);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:10px;white-space:pre-wrap;color:#c9c3e6;max-height:64px;overflow:auto}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:56px;background:var(--card);border:1px dashed var(--line);border-radius:20px}
  .spinner{width:11px;height:11px;border:2px solid rgba(245,158,11,.3);border-top-color:var(--amber);border-radius:50%;animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .ignored{opacity:.5}

  .pager{display:flex;justify-content:center;align-items:center;gap:6px;margin:22px 0 0;flex-wrap:wrap}
  .pg{min-width:36px;height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:rgba(20,15,36,.85);color:#cfc9ee;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s}
  .pg:hover:not(:disabled){border-color:var(--neon);color:#e9d5ff}
  .pg.on{background:linear-gradient(135deg,#7c3aed,#0891b2);border-color:transparent;color:#0b0614}
  .pg:disabled{opacity:.4;cursor:not-allowed}
  .pg.info{border:none;background:transparent;box-shadow:none;color:var(--muted);font-weight:600;cursor:default}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}#list{grid-template-columns:1fr}.step{font-size:10.5px;gap:5px}.card{height:auto;min-height:200px}}
</style>
</head>
<body>
<header>
  <h1><span class="logo">🐼</span> BestWork · WhatsApp İş Paneli</h1>
  <span class="conn"><span class="dot"></span><span id="conn">…</span></span>
</header>
<div class="wrap">
  <div class="stats">
    <div class="stat p"><div class="n" id="s-pending">0</div><div class="l">İş emri bekliyor</div></div>
    <div class="stat w"><div class="n" id="s-processing">0</div><div class="l">İşleniyor</div></div>
    <div class="stat d"><div class="n" id="s-done">0</div><div class="l">Sonuçlandı</div></div>
    <div class="stat e"><div class="n" id="s-error">0</div><div class="l">Hata</div></div>
  </div>
  <div id="list"></div>
  <div class="pager" id="pager"></div>
</div>
<script>
  const esc = (s) => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
  const step = (cls, label, ic) => '<div class="step ' + cls + '"><span class="ic">' + (ic || '') + '</span>' + label + '</div>';
  const bars = '<div class="bar"></div>';
  const spin = '<span class="spinner"></span>';
  const initials = (m) => {
    const n = (m.name || m.from || '?').trim();
    return n.slice(0, 1).toUpperCase();
  };

  function stepsFor(st) {
    if (st === 'processing')
      return step('done', 'Geldi', '✓') + bars + step('active', 'İşleniyor', spin) + bars + step('', 'Bitti');
    if (st === 'done')
      return step('done', 'Geldi', '✓') + bars + step('done', 'İşlendi', '✓') + bars + step('done', 'Bitti', '✓');
    if (st === 'error')
      return step('done', 'Geldi', '✓') + bars + step('done', 'İşlendi', '✓') + bars + step('bad', 'Başarısız', '✕');
    if (st === 'ignored')
      return step('', 'Geldi') + bars + step('', '—') + bars + step('', 'Yok sayıldı');
    return step('active', 'Geldi') + bars + step('', 'İşleniyor') + bars + step('', 'Bitti');
  }

  const LABEL = { pending: 'İş emri bekliyor', processing: 'İşleniyor', done: 'Sonuçlandı', error: 'Hata', ignored: 'Yok sayıldı' };

  async function tick() {
    try {
      const q = await (await fetch('/qr')).json();
      document.getElementById('conn').textContent = q.status || '-';
    } catch (e) {}
    try {
      const d = await (await fetch('/messages')).json();
      const ms = (d.messages || []).filter((m) => m.status !== 'ignored').slice().reverse();
      const c = { pending: 0, processing: 0, done: 0, error: 0 };
      ms.forEach((m) => { if (c[m.status] !== undefined) c[m.status]++; });
      document.getElementById('s-pending').textContent = c.pending;
      document.getElementById('s-processing').textContent = c.processing;
      document.getElementById('s-done').textContent = c.done;
      document.getElementById('s-error').textContent = c.error;

      allMs = ms;
      render();
    } catch (e) {}
  }

  // ── Sayfalama ──
  let allMs = [];
  let page = 1;
  const PER = 9;

  function cardHtml(m) {
    const st = m.status || 'pending';
    const t = new Date(m.ts).toLocaleString('tr-TR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
    return '<div class="card ' + st + '">' +
      '<div class="meta">' +
        '<span class="who"><span class="avatar">' + esc(initials(m)) + '</span>' + esc(m.name || m.from) + '</span>' +
        '<span class="badge b-' + st + '">' + (LABEL[st] || st) + '</span>' +
      '</div>' +
      '<div class="req">' + esc(m.text) + (m.image ? ' <span class="badge b-pending">📷 resim</span>' : '') + '</div>' +
      '<div class="steps">' + stepsFor(st) + '</div>' +
      (m.result ? '<div class="res">' + esc(m.result) + '</div>' : '') +
      '<div style="font-size:10.5px;color:#7c7699;margin-top:8px">' + t + '</div>' +
      '</div>';
  }

  function pageNums(cur, total) {
    const out = [];
    const add = (v) => { if (!out.includes(v)) out.push(v); };
    add(1);
    for (let i = cur - 1; i <= cur + 1; i++) if (i > 1 && i < total) add(i);
    add(total);
    out.sort((a, b) => a - b);
    const res = [];
    let prev = 0;
    for (const n of out) {
      if (n - prev > 1) res.push('…');
      res.push(n);
      prev = n;
    }
    return res;
  }

  function render() {
    const pages = Math.max(1, Math.ceil(allMs.length / PER));
    if (page > pages) page = pages;
    if (page < 1) page = 1;
    const slice = allMs.slice((page - 1) * PER, page * PER);
    document.getElementById('list').innerHTML =
      slice.map(cardHtml).join('') ||
      '<div class="empty">Henüz iş emri yok.<br/>Ender “panda ... ” yazınca burada kutu olarak görünür.</div>';

    const p = document.getElementById('pager');
    if (allMs.length <= PER) {
      p.innerHTML = allMs.length ? '<span class="pg info">' + allMs.length + ' iş emri</span>' : '';
      return;
    }
    let h = '<button class="pg" ' + (page === 1 ? 'disabled' : '') + ' onclick="go(' + (page - 1) + ')">‹</button>';
    for (const n of pageNums(page, pages)) {
      h += n === '…'
        ? '<span class="pg info">…</span>'
        : '<button class="pg ' + (n === page ? 'on' : '') + '" onclick="go(' + n + ')">' + n + '</button>';
    }
    h += '<button class="pg" ' + (page === pages ? 'disabled' : '') + ' onclick="go(' + (page + 1) + ')">›</button>';
    h += '<span class="pg info">' + page + ' / ' + pages + ' · ' + allMs.length + ' iş</span>';
    p.innerHTML = h;
  }

  window.go = (n) => {
    page = n;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  tick();
  setInterval(tick, 2000);
</script>
</body>
</html>
